<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | Personal Services</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <div class="container nav-wrap">
    <a class="brand" href="index.html">Personal Services</a>
    <div class="header-actions">
      <span id="adminEmail" class="admin-email"></span>
      <button id="logoutBtn" class="btn btn-outline">Logout</button>
    </div>
  </div>
</header>

<main class="container dashboard">
  <div class="dashboard-title">
    <div>
      <span class="eyebrow">Administration</span>
      <h1>Dashboard</h1>
      <p>Manage your services and WhatsApp ordering number.</p>
    </div>
  </div>

  <section class="panel">
    <div class="panel-header">
      <div>
        <h2>Services</h2>
        <p>Active services appear automatically on the homepage.</p>
      </div>
      <button id="addServiceBtn" class="btn btn-primary">Add Service</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Service Name</th><th>Status</th><th>Order</th><th>Actions</th></tr>
        </thead>
        <tbody id="servicesTable">
          <tr><td colspan="4" class="loading">Loading services...</td></tr>
        </tbody>
      </table>
    </div>
    <div id="serviceMessage" class="form-message" role="alert"></div>
  </section>

  <section class="panel">
    <div class="panel-header">
      <div>
        <h2>Settings</h2>
        <p>Visitors use this number when they click Order Now.</p>
      </div>
    </div>
    <form id="settingsForm" class="settings-form">
      <label for="whatsappNumber">WhatsApp Number</label>
      <input id="whatsappNumber" type="tel" inputmode="numeric" maxlength="20" placeholder="01728405841" required>
      <button class="btn btn-primary" type="submit">Save Changes</button>
    </form>
    <div id="settingsMessage" class="form-message" role="alert"></div>
  </section>
</main>

<div id="serviceModal" class="modal" hidden>
  <div class="modal-backdrop" data-close-modal></div>
  <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-close" data-close-modal aria-label="Close">×</button>
    <h2 id="modalTitle">Add Service</h2>
    <form id="serviceForm">
      <input id="serviceId" type="hidden">
      <label for="serviceName">Service Name</label>
      <input id="serviceName" type="text" maxlength="100" required>
      <label for="serviceStatus">Status</label>
      <select id="serviceStatus">
        <option value="true">Active</option>
        <option value="false">Disabled</option>
      </select>
      <label for="serviceOrder">Display Order</label>
      <input id="serviceOrder" type="number" min="0" max="999999" step="1" required>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" data-close-modal>Cancel</button>
        <button type="submit" class="btn btn-primary">Save Service</button>
      </div>
      <div id="modalMessage" class="form-message" role="alert"></div>
    </form>
  </section>
</div>

<script type="module" src="js/dashboard.js"></script>
</body>
</html>
